services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: raceday-azurite
    command: "azurite --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  api:
    build:
      context: ./RaceDay.API
      dockerfile: Dockerfile
    container_name: raceday-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DISABLE_HTTPS_REDIRECT: "true"
      ConnectionStrings__DefaultConnection: ${RACEDAY_DB_CONNECTION}
      Jwt__Key: ${RACEDAY_JWT_KEY}
      Jwt__Issuer: RaceDayApi
      Jwt__Audience: RaceDayClient
      Jwt__ExpiryMinutes: "60"
      BlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUz5t6V6N3Q=;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      BlobStorage__ContainerName: event-banners
    depends_on:
      - azurite
    ports:
      - "8080:8080"

  web:
    build:
      context: ./RaceDay.Web
      dockerfile: Dockerfile
    container_name: raceday-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApiSettings__BaseUrl: http://api:8080/
    depends_on:
      - api
    ports:
      - "8081:8080"

volumes:
  azurite-data:
