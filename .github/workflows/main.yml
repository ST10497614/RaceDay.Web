
name: RaceDay CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore RaceDay.API/RaceDay.API.csproj

      - name: Build API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore

      - name: Restore Web
        run: dotnet restore RaceDay.Web/RaceDay.Web.csproj

      - name: Build Web
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Run API Tests
        run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release
